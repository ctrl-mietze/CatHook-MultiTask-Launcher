name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use runner AAPT2
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties

      - name: Restore permanent CatCore signing key
        env:
          CATHOOK_RELEASE_KEYSTORE_BASE64: ${{ secrets.CATHOOK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CATHOOK_RELEASE_KEYSTORE_BASE64" || {
            echo "Missing CATHOOK_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          }
          printf '%s' "$CATHOOK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cathook-release.jks"
          chmod 600 "$RUNNER_TEMP/cathook-release.jks"

      - name: Build permanently signed V2 APK
        env:
          CATHOOK_STORE_FILE: ${{ runner.temp }}/cathook-release.jks
          CATHOOK_STORE_PASSWORD: ${{ secrets.CATHOOK_STORE_PASSWORD }}
          CATHOOK_KEY_ALIAS: ${{ secrets.CATHOOK_KEY_ALIAS }}
          CATHOOK_KEY_PASSWORD: ${{ secrets.CATHOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CATHOOK_STORE_PASSWORD"
          test -n "$CATHOOK_KEY_ALIAS"
          test -n "$CATHOOK_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CatCore-MultiTask-V2-dev2-signed.apk

      - name: Verify APK contract and permanent signature
        run: |
          set -euo pipefail
          APK="CatCore-MultiTask-V2-dev2-signed.apk"

          test -f "$APK"

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKANALYZER"
          test -n "$APKSIGNER"

          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.catcore.ctrlmietze.multitask"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "20001"
          test "$("$APKANALYZER" manifest version-name "$APK")" = "2.0.0.0-dev2"
          test "$("$APKANALYZER" manifest min-sdk "$APK")" = "28"
          test "$("$APKANALYZER" manifest target-sdk "$APK")" = "36"

          unzip -p "$APK" assets/xposed_init \
            | grep -Fx 'com.catcore.ctrlmietze.multitask.xposed.MultiTaskHook'

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fqi 'certificate SHA-256 digest: a35d6ad4349ce69680a97d6cb31c30ce5c41bcbaa87716dc74fd515f1d362db8' /tmp/apksigner.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CatCore-MultiTask-V2-signed
          path: CatCore-MultiTask-V2-dev2-signed.apk
