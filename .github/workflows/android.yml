name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use runner AAPT2
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contract
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "com.catcore.ctrlmietze.multitask"
          test "$(apkanalyzer manifest version-code "$APK")" = "20000"
          test "$(apkanalyzer manifest version-name "$APK")" = "2.0.0.0-dev1"
          test "$(apkanalyzer manifest min-sdk "$APK")" = "28"
          test "$(apkanalyzer manifest target-sdk "$APK")" = "36"

          unzip -p "$APK" assets/xposed_init             | grep -Fx 'com.catcore.ctrlmietze.multitask.xposed.MultiTaskHook'

          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'

      - uses: actions/upload-artifact@v4
        with:
          name: CatCore-MultiTask-debug
          path: app/build/outputs/apk/debug/app-debug.apk
