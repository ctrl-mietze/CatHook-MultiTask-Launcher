name: Build Termux APT index

on:
  push:
    branches: [termux-repo]
    paths:
      - '*.deb'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: termux-repo

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build flat APT metadata
        shell: bash
        run: |
          set -euo pipefail
          dpkg-scanpackages . /dev/null > Packages
          gzip -9cn Packages > Packages.gz

          cat > Release <<'META'
          Origin: CatHook Termux Repository
          Label: CatHook Termux Repository
          Suite: stable
          Codename: stable
          Architectures: all aarch64
          Components: main
          Description: Raphael's Termux package channel for CatHook/Android bridge tools
          META

          {
            echo 'MD5Sum:'
            for f in Packages Packages.gz; do
              printf ' %s %16s %s\n' "$(md5sum "$f" | awk '{print $1}')" "$(stat -c '%s' "$f")" "$f"
            done
            echo 'SHA256:'
            for f in Packages Packages.gz; do
              printf ' %s %16s %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$(stat -c '%s' "$f")" "$f"
            done
          } >> Release

      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CatHook Repo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages Packages.gz Release
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'repo: rebuild APT index'
          git push
