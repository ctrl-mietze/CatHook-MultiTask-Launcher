name: Publish v0.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.release.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.exists == 'false'
        with:
          gradle-version: '8.11.1'
      - name: Use runner AAPT2
        if: steps.release.outputs.exists == 'false'
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
      - name: Build APK
        if: steps.release.outputs.exists == 'false'
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CatCore-MultiTask-v0.1.0.apk
      - name: Create source archive
        if: steps.release.outputs.exists == 'false'
        run: git archive --format=zip --prefix=CatCore-MultiTask-v0.1.0/ -o CatCore-MultiTask-v0.1.0-source.zip HEAD
      - name: Publish GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 CatCore-MultiTask-v0.1.0.apk CatCore-MultiTask-v0.1.0-source.zip --target "$GITHUB_SHA" --title "CatCore MultiTask v0.1.0" --notes-file RELEASE_NOTES.md
