name: Publish v1.5.0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".release-v1.5.0.1-trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.0.1 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v1.5.0.1 already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          gradle-version: '8.11.1'

      - name: Use runner AAPT2
        if: steps.existing.outputs.exists == 'false'
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties

      - name: Restore release signing key
        if: steps.existing.outputs.exists == 'false'
        env:
          CATHOOK_RELEASE_KEYSTORE_BASE64: ${{ secrets.CATHOOK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$CATHOOK_RELEASE_KEYSTORE_BASE64" || {
            echo "Missing CATHOOK_RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          }
          printf '%s' "$CATHOOK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cathook-release.jks"
          chmod 600 "$RUNNER_TEMP/cathook-release.jks"

      - name: Build signed release APK
        if: steps.existing.outputs.exists == 'false'
        env:
          CATHOOK_STORE_FILE: ${{ runner.temp }}/cathook-release.jks
          CATHOOK_STORE_PASSWORD: ${{ secrets.CATHOOK_STORE_PASSWORD }}
          CATHOOK_KEY_ALIAS: ${{ secrets.CATHOOK_KEY_ALIAS }}
          CATHOOK_KEY_PASSWORD: ${{ secrets.CATHOOK_KEY_PASSWORD }}
        run: |
          test -n "$CATHOOK_STORE_PASSWORD" || { echo "Missing CATHOOK_STORE_PASSWORD"; exit 1; }
          test -n "$CATHOOK_KEY_ALIAS" || { echo "Missing CATHOOK_KEY_ALIAS"; exit 1; }
          test -n "$CATHOOK_KEY_PASSWORD" || { echo "Missing CATHOOK_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MultiTask-v1.5.0.1.apk

      - name: Verify APK signature
        if: steps.existing.outputs.exists == 'false'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs MultiTask-v1.5.0.1.apk

      - name: Create source archive
        if: steps.existing.outputs.exists == 'false'
        run: git archive --format=zip --prefix=MultiTask-v1.5.0.1/ -o MultiTask-v1.5.0.1-source.zip HEAD

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.0.1 \
            MultiTask-v1.5.0.1.apk \
            MultiTask-v1.5.0.1-source.zip \
            --target "$GITHUB_SHA" \
            --title "MultiTask v1.5.0.1" \
            --notes-file RELEASE_NOTES_V1.5.0.1.md
