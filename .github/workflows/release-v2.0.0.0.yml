name: Publish v2.0.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".release-v2.0.0.0-trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0.0 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          gradle-version: '8.11.1'

      - name: Use runner AAPT2
        if: steps.existing.outputs.exists == 'false'
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties

      - name: Restore permanent CatCore signing key
        if: steps.existing.outputs.exists == 'false'
        env:
          CATHOOK_RELEASE_KEYSTORE_BASE64: ${{ secrets.CATHOOK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CATHOOK_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$CATHOOK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cathook-release.jks"
          chmod 600 "$RUNNER_TEMP/cathook-release.jks"

      - name: Build signed V2 APK
        if: steps.existing.outputs.exists == 'false'
        env:
          CATHOOK_STORE_FILE: ${{ runner.temp }}/cathook-release.jks
          CATHOOK_STORE_PASSWORD: ${{ secrets.CATHOOK_STORE_PASSWORD }}
          CATHOOK_KEY_ALIAS: ${{ secrets.CATHOOK_KEY_ALIAS }}
          CATHOOK_KEY_PASSWORD: ${{ secrets.CATHOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CatCore-MultiTask-v2.0.0.0.apk

      - name: Verify APK identity and signature
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs CatCore-MultiTask-v2.0.0.0.apk
          "$AAPT" dump badging CatCore-MultiTask-v2.0.0.0.apk | grep "package: name='com.catcore.ctrlmietze.multitask'"
          "$AAPT" dump badging CatCore-MultiTask-v2.0.0.0.apk | grep "versionCode='20008'"
          "$AAPT" dump badging CatCore-MultiTask-v2.0.0.0.apk | grep "versionName='2.0.0.0'"

      - name: Package Optional Root Module
        if: steps.existing.outputs.exists == 'false'
        run: |
          cd kernelsu-module
          zip -r ../CatCore-MultiTask-Optional-Root-Module-v2.0.0.0.zip . -x '*.git*'

      - name: Create source archive
        if: steps.existing.outputs.exists == 'false'
        run: git archive --format=zip --prefix=CatCore-MultiTask-v2.0.0.0/ -o CatCore-MultiTask-v2.0.0.0-source.zip HEAD

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0.0             CatCore-MultiTask-v2.0.0.0.apk             CatCore-MultiTask-Optional-Root-Module-v2.0.0.0.zip             CatCore-MultiTask-v2.0.0.0-source.zip             --target "$GITHUB_SHA"             --title "CatCore MultiTask v2.0.0.0"             --notes-file RELEASE_NOTES_V2.0.0.0.md
